app {
  spark {
    app-name = "Ecommerce-Spark-Pipeline-Groupe3"
    master = "local[*]"
    shuffle-partitions = 8
  }

  paths {
    transactions = "src/main/resources/data/transactions.csv"
    users        = "src/main/resources/data/users.json"
    products     = "src/main/resources/data/products.parquet"
    merchants    = "src/main/resources/data/merchants.csv"

    output {
      base-dir            = "output"
      quality-report      = "output/quality_report"
      rejected-records    = "output/rejected"
      enriched-data       = "output/enriched_transactions"
      merchant-kpis       = "output/merchant_kpis"
      cohort-retention    = "output/cohort_retention"
    }
  }

  optimizations {
    enable-cache     = true
    enable-broadcast = true
  }

  validation {
    min-transaction-amount = 0.0
    timestamp-length       = 14
    min-user-age           = 16
    max-user-age           = 100
    min-annual-income      = 0.0
    min-product-price      = 0.0
    min-product-rating     = 0.0
    max-product-rating     = 5.0
    min-commission-rate    = 0.0
    max-commission-rate    = 1.0
  }
}
